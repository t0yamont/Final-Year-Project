[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1energy"
version = "0.1.0"
description = "Reproducible research foundation for F1 energy deployment"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
f1energy = "f1energy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
